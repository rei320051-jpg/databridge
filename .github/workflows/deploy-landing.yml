name: Deploy 赛题一落地页到 GitHub Pages

# 经典分支部署：从 赛题一/物料/ 单源构建静态站点，推送到独立的 gh-pages 分支。
# 需要在 Settings → Pages 选择 Source=Deploy from a branch、Branch=gh-pages/(root)。
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-landing.yml'
      - '赛题一/物料/落地页_index.html'
      - '赛题一/物料/海报_朋友圈.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site（落地页 -> index.html，海报 -> poster.html）
        run: |
          mkdir _site
          cp '赛题一/物料/落地页_index.html' _site/index.html
          cp '赛题一/物料/海报_朋友圈.html' _site/poster.html
          printf 'User-agent: *\nAllow: /\n' > _site/robots.txt

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
