name: Deploy 赛题一落地页到 GitHub Pages

# GitHub Actions 模式部署：从 赛题一/物料/ 单源构建静态站点并发布到 Pages。
# 仓库 Settings → Pages → Source 需为 "GitHub Actions"（已配置）。
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-landing.yml'
      - '赛题一/物料/落地页_index.html'
      - '赛题一/物料/海报_朋友圈.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble site（落地页 -> index.html，海报 -> poster.html）
        run: |
          mkdir _site
          cp '赛题一/物料/落地页_index.html' _site/index.html
          cp '赛题一/物料/海报_朋友圈.html' _site/poster.html
          printf 'User-agent: *\nAllow: /\n' > _site/robots.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
